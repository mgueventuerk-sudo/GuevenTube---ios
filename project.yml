name: GuevenTube
packages:
  GuevenCore:
    path: Packages/GuevenCore
options:
  bundleIdPrefix: de.gueventube
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GuevenTube:
    type: application
    platform: iOS
    sources: [GuevenTube]
    dependencies: [{package: GuevenCore}, {target: GuevenTubeWidget}]
    entitlements:
      path: GuevenTube/GuevenTube.entitlements
      properties:
        com.apple.security.application-groups: [group.de.gueventube.app]
    info:
      path: GuevenTube/Info.plist
      properties:
        CFBundleDisplayName: GuevenTube
        UILaunchScreen: {}
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [de.gueventube.app.newvideos]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity: {NSAllowsArbitraryLoads: false}
        CFBundleURLTypes:
          - CFBundleURLName: de.gueventube.app
            CFBundleURLSchemes: [gueventube]
        NSLocalNetworkUsageDescription: GuevenTube sucht Fernseher mit GuevenTube im WLAN, um sie als Fernbedienung zu steuern.
        NSBonjourServices: [_gueventube._tcp]
        NSFaceIDUsageDescription: Face ID entsperrt Konto und Einstellungen.
        NSCameraUsageDescription: Die Kamera liest den QR-Code zum Koppeln mit dem Fernseher.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gueventube.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: GuevenTube/GuevenTube-Bridging-Header.h
  GuevenTubeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GuevenTubeTests]
    dependencies: [{target: GuevenTube}]
  GuevenTubeWidget:
    type: app-extension
    platform: iOS
    sources: [GuevenTubeWidget]
    dependencies: [{package: GuevenCore}]
    entitlements:
      path: GuevenTubeWidget/GuevenTubeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.de.gueventube.app]
    info:
      path: GuevenTubeWidget/Info.plist
      properties:
        CFBundleDisplayName: GuevenTube
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gueventube.app.widget
        TARGETED_DEVICE_FAMILY: "1"
