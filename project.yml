name: GuevenTube
packages:
  GuevenCore:
    path: Packages/GuevenCore
options:
  bundleIdPrefix: de.gueventube
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GuevenTube:
    type: application
    platform: iOS
    sources: [GuevenTube]
    dependencies: [{package: GuevenCore}]
    info:
      path: GuevenTube/Info.plist
      properties:
        CFBundleDisplayName: GuevenTube
        UILaunchScreen: {}
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [de.gueventube.app.newvideos]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity: {NSAllowsArbitraryLoads: false}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.gueventube.app
        TARGETED_DEVICE_FAMILY: "1"
  GuevenTubeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GuevenTubeTests]
    dependencies: [{target: GuevenTube}]
