name: iOS (unsigniertes IPA)
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/GuevenCore
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: iPhone-Simulator suchen
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' || true)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Gefundener Simulator: ${UDID:-keiner}"
      - name: Tests
        if: steps.sim.outputs.udid != ''
        run: xcodebuild test -project GuevenTube.xcodeproj -scheme GuevenTube -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO
      - name: Oberflächen-Bilder sichern
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: GuevenTube-screens, path: /tmp/gt-shots, if-no-files-found: ignore }
      - name: Hinweis ohne Simulator
        if: steps.sim.outputs.udid == ''
        run: echo "::warning::Kein iPhone-Simulator auf dem Runner. App-Tests uebersprungen, Core-Tests liefen oben."
      - name: Unsigniertes IPA (zum Sideloading)
        run: |
          xcodebuild archive -project GuevenTube.xcodeproj -scheme GuevenTube -configuration Release -sdk iphoneos -archivePath build/GT.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p build/Payload && cp -R build/GT.xcarchive/Products/Applications/GuevenTube.app build/Payload/
          (cd build && zip -qr GuevenTube-unsigned.ipa Payload)
          shasum -a 256 build/GuevenTube-unsigned.ipa > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: GuevenTube-ipa, path: "build/GuevenTube-unsigned.ipa\nbuild/SHA256SUMS.txt" }
